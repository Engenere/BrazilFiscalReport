name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Python 3.10", python: "3.10", os: "ubuntu"}
          - {name: "Python 3.11", python: "3.11", os: "ubuntu"}
          - {name: "Python 3.12", python: "3.12", os: "ubuntu"}
          - {name: "Python 3.13", python: "3.13", os: "ubuntu"}
          - {name: "Python 3.14", python: "3.14", os: "ubuntu"}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install qpdf ⚙️
        run: sudo apt-get update --allow-releaseinfo-change && sudo apt-get install qpdf
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements-test.txt pytest pytest-cov click PyYAML
      - name: Test
        run: |
          pytest --cov=./brazilfiscalreport --cov-report=xml --cov-branch --doctest-glob="docs/*.md"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Engenere/BrazilFiscalReport
