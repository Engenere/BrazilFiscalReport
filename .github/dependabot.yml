version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Só as versões fixadas em requirements-test.txt.
    allow:
      - dependency-name: fpdf2
      - dependency-name: phonenumbers
      - dependency-name: python-barcode
      - dependency-name: qrcode
    commit-message:
      prefix: "CI"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Um PR por mês com todas as actions, em vez de um por action.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "CI"
